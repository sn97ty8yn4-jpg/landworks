name: Earthworks - Fast physical machine coupling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earthworks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Test offline material reference (not Jolt acceptance)
        run: python3 -m unittest discover -s tests -p test_material_reference.py -v
      - name: Install Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import scripts and report errors
        shell: bash
        run: |
          mkdir -p ci-earthworks
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee ci-earthworks/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' ci-earthworks/import.log; then
            exit 1
          fi
      - name: Test below-grade collisions and pad seams
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/below_grade_smoke.gd 2>&1 | tee ci-earthworks/trench.log
          grep 'BELOW_GRADE PASS' ci-earthworks/trench.log
      - name: Test detailed machine geometry
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/detailed_skin_smoke.gd 2>&1 | tee ci-earthworks/geometry.log
          grep 'DETAILED_SKIN PASS' ci-earthworks/geometry.log
      - name: Test independent particle conservation
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/material_mechanics_smoke.gd 2>&1 | tee ci-earthworks/materials.log
          grep 'MATERIAL_MECHANICS PASS' ci-earthworks/materials.log
          timeout 65s godot --headless --path . --script res://landworks/scripts/unpowered_soil_smoke.gd 2>&1 | tee ci-earthworks/unpowered.log
          grep 'UNPOWERED_SOIL PASS' ci-earthworks/unpowered.log
          timeout 65s godot --headless --path . --script res://landworks/scripts/detailed_cab_smoke.gd 2>&1 | tee ci-earthworks/cab.log
          grep 'DETAILED_CAB PASS' ci-earthworks/cab.log
      - name: Test rigged models and new mechanisms
        shell: bash
        run: |
          timeout 85s godot --headless --path . --script res://landworks/scripts/rigged_model_smoke.gd 2>&1 | tee ci-earthworks/rigged.log
          grep 'RIGGED_MODEL PASS' ci-earthworks/rigged.log
      - name: Test two-state slope stability
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/slope_stability_smoke.gd 2>&1 | tee ci-earthworks/slope.log
          grep 'SLOPE_STABILITY PASS' ci-earthworks/slope.log
      - name: Test playable dig regression
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/playable_dig_regression.gd 2>&1 | tee ci-earthworks/playable_dig.log
          grep 'PLAYABLE_DIG PASS' ci-earthworks/playable_dig.log
      - name: Test legacy particle conservation
        shell: bash
        run: |
          timeout 65s godot --headless --path . --script res://landworks/scripts/earthworks_smoke.gd 2>&1 | tee ci-earthworks/soil.log
          grep 'EARTHWORKS PASS' ci-earthworks/soil.log
      - name: Test physical excavator cutting and dumping
        shell: bash
        run: |
          timeout 85s godot --headless --path . --script res://landworks/scripts/earthwork_machine_smoke.gd 2>&1 | tee ci-earthworks/machine.log
          grep 'PHYSICAL_DIG PASS' ci-earthworks/machine.log
      - name: Archive soil simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthworks-machine-telemetry
          path: ci-earthworks/
          retention-days: 30
