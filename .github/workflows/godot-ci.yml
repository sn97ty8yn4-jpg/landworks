name: Godot CI - Headless field trials

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-test:
    name: Godot 4.6.1 / GDScript / Jolt
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require actual Godot project
        shell: bash
        run: |
          test -s project.godot || {
            echo "::error::project.godot is absent. Copy the extracted Landworks v0.6 project files into the repository root."
            exit 1
          }
          test -f landworks/scenes/tractor_work_lab.tscn || {
            echo "::error::Tractor field-test scene missing from imported project."
            exit 1
          }
          test -f landworks/scenes/excavator_work_lab.tscn || {
            echo "::error::Excavator field-test scene missing from imported project."
            exit 1
          }

      - name: Install Godot 4.6.1 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false

      - name: Record engine version
        run: godot --headless --version

      - name: Python tests (non-physics)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_project.py

      - name: Godot editor import / GDScript parse
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          timeout 180s godot --headless --path . --editor --import 2>&1 | tee ci-logs/godot-import.log

      - name: Run and parse main yard
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --quit-after 120 2>&1 | tee ci-logs/godot-yard.log

      - name: Run actual Godot tractor/excavator trials
        shell: bash
        run: |
          python3 tools/run_work_tests.py --godot godot --out "$GITHUB_WORKSPACE/field_test_results"
          python3 tools/analyse_work_tests.py --dir "$GITHUB_WORKSPACE/field_test_results" | tee ci-logs/field-trial-analysis.txt

      - name: Reject missing, truncated or invalid field telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          base = Path("field_test_results")
          cases = ["flat_empty","flat_400","hill_400","hill_800","lift_250","lift_500","lift_1000"]
          for case in cases:
              typ = "excavator" if case.startswith("lift_") else "tractor"
              sample = base / f"{typ}_{case}_samples.csv"
              summary = base / f"{typ}_{case}_summary.csv"
              if not sample.is_file() or not summary.is_file():
                  raise SystemExit(f"MISSING: {case} measurement files")
              with sample.open(newline="") as f:
                  rows=list(csv.DictReader(f))
              if len(rows) < 80:
                  raise SystemExit(f"TRUNCATED: {case}: {len(rows)} rows")
              print(case, "measured rows:", len(rows), "last time:", rows[-1].get("time_s"))
          PY

      - name: Enforce measured physical behaviour (not just CSV presence)
        shell: bash
        run: |
          python3 tools/validate_physics.py --dir "$GITHUB_WORKSPACE/field_test_results"

      - name: Archive actual Godot outputs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-field-trial-telemetry
          path: |
            ci-logs/
            field_test_results/
          if-no-files-found: warn
          retention-days: 30
