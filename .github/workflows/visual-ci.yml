name: Landworks Visual & Work-Pad QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landworks-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false
      - name: Import project and reject script errors
        shell: bash
        run: |
          mkdir -p ci-visuals
          godot --headless --path . --editor --import > ci-visuals/import.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' ci-visuals/import.log; then
            exit 1
          fi
      - name: Verify physical access to excavation pad
        shell: bash
        run: |
          set -o pipefail
          timeout 85s godot --headless --path . --script res://landworks/scripts/work_pad_access_smoke.gd 2>&1 | tee ci-visuals/access.log
          grep 'WORK_PAD_ACCESS PASS' ci-visuals/access.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid type in function' ci-visuals/access.log; then
            echo "::error::Play-mode runtime GDScript failed in access test"
            exit 1
          fi
      - name: Install Mesa software renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
      - name: Render real Godot visual previews
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://landworks/scripts/visual_snapshot.gd -- --preview-dir="$GITHUB_WORKSPACE/ci-visuals" 2>&1 | tee ci-visuals/render.log
          grep 'RENDERED_FRAME_OK' ci-visuals/render.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid type in function' ci-visuals/render.log; then
            echo "::error::Visual render contains GDScript runtime errors"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ['landworks_tractor.png','landworks_excavator.png']:
              f=Path('ci-visuals')/name
              b=f.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n'
              w,h = struct.unpack('>II', b[16:24])
              assert w >= 1000 and h >= 600
              assert len(b) > 9000, f'{name} suspiciously small/blank'
              print(name, w, h, len(b), 'bytes')
          PY
      - name: Archive previews and access log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landworks-real-engine-render-preview
          path: ci-visuals/
          retention-days: 30
